<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Aqsha Fashionz · Home-Made Natural Soap</title>
    <meta
      name="description"
      content="Aqsha Fashionz makes 100% natural home-made soaps — including Kuppameni and Goatmilk & Manjishtha — handcrafted in small batches with fresh leaves and pure ingredients. Order on WhatsApp."
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#f9f8f3"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#14201a"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Fonts (gracefully falls back to system fonts when offline) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Inter:wght@400..600&display=swap"
      rel="stylesheet"
    />

    <!-- Apply the saved theme before first paint to avoid a flash -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('aqsha-theme') || 'system'
          var prefersDark = window.matchMedia(
            '(prefers-color-scheme: dark)',
          ).matches
          var isDark = stored === 'dark' || (stored === 'system' && prefersDark)
          var root = document.documentElement
          root.classList.toggle('dark', isDark)
          root.style.colorScheme = isDark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
